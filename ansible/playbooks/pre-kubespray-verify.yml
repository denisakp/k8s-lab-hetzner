---
# Pre-Kubespray Verification Playbook
# Verify that all prerequisites for Kubespray are met
# Run this BEFORE executing Kubespray cluster.yml

- name: Pre-Kubespray verification
  hosts: k8s_cluster
  gather_facts: yes
  tasks:
    - name: Verify Python 3 installed
      ansible.builtin.command: python3 --version
      register: python_version
      changed_when: false
      failed_when: python_version.rc != 0

    - name: Verify SSH access via ansible-deploy user
      ansible.builtin.command: whoami
      register: current_user
      changed_when: false
      failed_when: current_user.rc != 0

    - name: Verify sudo access
      ansible.builtin.command: sudo -l
      register: sudo_check
      changed_when: false
      failed_when: sudo_check.rc != 0

    - name: Check network connectivity
      ansible.builtin.command: ping -c 1 8.8.8.8
      changed_when: false
      failed_when: false
      register: ping_result

    - name: Get systemd ready (verify systemd is available)
      ansible.builtin.command: systemctl --version
      register: systemd_check
      changed_when: false
      failed_when: systemd_check.rc != 0

    - name: Get CPU info
      ansible.builtin.command: nproc
      register: cpu_count
      changed_when: false

    - name: Display pre-kubespray verification results
      ansible.builtin.debug:
        msg: |
          ✅ Pre-Kubespray Verification Complete
          
          Python: {{ python_version.stdout }}
          User: {{ current_user.stdout | trim }}
          CPU Cores: {{ cpu_count.stdout | trim }}
          Systemd: Ready
          Network: {% if ping_result.rc == 0 %}✅ OK{% else %}⚠️ Check connectivity{% endif %}
          
          👉 Ready to run Kubespray:
             ansible-playbook -i inventory/hosts.yml kubespray/cluster.yml
