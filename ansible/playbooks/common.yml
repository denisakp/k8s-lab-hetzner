---
# Universal infrastructure setup for all VMs
# Handles: users, packages, timezone, keyboard, firewall (SSH only), fail2ban
# Does NOT assume anything about VM purpose (K8s, app server, etc.)
# 
# Ubuntu 24.04 required

- name: Infrastructure setup
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  
  pre_tasks:
    - name: Verify Ubuntu 24.04
      assert:
        that:
          - ansible_facts['distribution'] == "Ubuntu"
          - ansible_facts['distribution_major_version'] == "24"
        fail_msg: "This playbook requires Ubuntu 24.04"
      tags: always

  roles:
    - user_management   # Create ansible-deploy and zanzibar users (sudo-enabled)
    - commons          # Packages, timezone, keyboard layout
    - fail2ban         # SSH brute-force protection
    - firewalld        # SSH-only firewall (allow external access)

  post_tasks:
    - name: Infrastructure setup summary
      debug:
        msg:
          - "✅ Infrastructure setup completed"
          - "System: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "Hostname: {{ ansible_facts['hostname'] }}"
          - "Users: ansible-deploy (limited sudo), zanzibar (full sudo)"
        verbosity: 1
      tags: always
