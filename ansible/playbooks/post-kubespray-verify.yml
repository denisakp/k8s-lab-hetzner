---
# Post-Kubespray Verification Playbook
# Verify that Kubespray successfully deployed all components
# Run this AFTER executing Kubespray cluster.yml

- name: Post-Kubespray verification
  hosts: k8s_cluster
  gather_facts: yes
  vars:
    expected_k8s_version: "1.29"
  tasks:
    - name: Check swap is disabled
      ansible.builtin.shell: swapon --show
      register: swap_check
      changed_when: false
      failed_when: swap_check.stdout_lines | length > 1

    - name: Verify kernel modules loaded (overlay)
      ansible.builtin.shell: lsmod | grep overlay
      register: overlay_check
      changed_when: false
      failed_when: overlay_check.rc != 0

    - name: Verify kernel modules loaded (br_netfilter)
      ansible.builtin.shell: lsmod | grep br_netfilter
      register: br_netfilter_check
      changed_when: false
      failed_when: br_netfilter_check.rc != 0

    - name: Verify sysctl ip_forward
      ansible.builtin.shell: sysctl net.ipv4.ip_forward
      register: ipforward_check
      changed_when: false
      failed_when: "'1' not in ipforward_check.stdout"

    - name: Check containerd is installed and running
      ansible.builtin.systemd:
        name: containerd
        state: started
      register: containerd_check
      changed_when: false

    - name: Verify containerd is accessible
      ansible.builtin.command: ctr version
      register: ctr_check
      changed_when: false
      become: yes

    - name: Check kubelet is running on all nodes
      ansible.builtin.systemd:
        name: kubelet
        state: started
      register: kubelet_check
      changed_when: false

    - name: Verify kubectl works on control plane
      ansible.builtin.command: kubectl version --short
      register: kubectl_check
      changed_when: false
      when: inventory_hostname in groups['k8s_control_plane']

    - name: Check node status on control plane
      ansible.builtin.command: kubectl get nodes -o wide
      register: nodes_status
      changed_when: false
      when: inventory_hostname in groups['k8s_control_plane']

    - name: Display post-kubespray verification results
      ansible.builtin.debug:
        msg: |
          ✅ Post-Kubespray Verification Results
          
          Swap: Disabled ✅
          Kernel Modules:
            - overlay: ✅
            - br_netfilter: ✅
          Sysctl:
            - ip_forward: ✅
          Container Runtime:
            - containerd: Running ✅
          Kubelet: Running ✅
          
          {% if inventory_hostname in groups['k8s_control_plane'] %}
          Control Plane Status:
          {{ nodes_status.stdout }}
          {% endif %}
          
          ✅ Kubernetes cluster successfully deployed!
