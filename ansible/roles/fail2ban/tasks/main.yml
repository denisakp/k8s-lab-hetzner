- name: Install Fail2Ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Create Fail2Ban configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
  notify: restart fail2ban

- name: Start and enable Fail2Ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true

- name: Check Fail2Ban service status
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
  register: fail2ban_service
  changed_when: false

- name: Pause briefly to allow Fail2Ban to initialize
  ansible.builtin.pause:
    seconds: 5

- name: Check Fail2Ban status
  ansible.builtin.command: fail2ban-client status
  register: fail2ban_status
  changed_when: false
  failed_when: false

- name: Show Fail2Ban status
  ansible.builtin.debug:
    var: fail2ban_status.stdout_lines
    