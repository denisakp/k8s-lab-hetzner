[defaults]
inventory = ./inventory/hosts.yml
roles_path = ./roles
remote_user = zanzibar
host_key_checking = False
retry_files_enabled = False
inject_facts_as_vars = False
deprecation_warnings = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
