---
# Kubernetes Cluster Configuration
# ℹ️ These variables are used for Kubespray integration
# Kubespray handles: swap, kernel modules, sysctl, container runtime, CNI
# We handle: user access, base packages, firewall (SSH only), fail2ban

# Kubespray variables
k8s_version: "1.29.0"
container_runtime: containerd

# Network configuration (consumed by Kubespray for CNI)
pod_network_cidr: "10.244.0.0/16"
service_cidr: "10.96.0.0/12"

# SSH firewall is handled by common.yml
# K8s-specific ports (kubeadm, kubelet, etcd) are managed by Kubespray via iptables
