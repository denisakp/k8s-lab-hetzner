all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  
  children:
    # ===== Proxmox Host =====
    proxmox_hosts:
      hosts:
        proxmox:
          ansible_host: <PROXMOX_IP>
          ansible_user: <PROXMOX_USER>
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_ssh_common_args: ''  # Direct access, no jump
    
    # ===== VMs (created by Terraform) =====
    # NOTE: This inventory is for general infrastructure setup
    # For Kubernetes deployment, use Kubespray with its own inventory
    vms:
      vars:
        ansible_ssh_common_args: '-o ProxyJump=<BASTION_USER>@<BASTION_IP>'
      
      hosts:
        # Bastion host (jump point to private network)
        bastion:
          ansible_host: <BASTION_IP>
          ansible_user: <BASTION_USER>
          ansible_ssh_common_args: '-o ProxyJump=<PROXMOX_USER>@<PROXMOX_IP>'
        
        # Generic VM nodes (add your VMs here)
        # These can be Kubernetes nodes, application servers, etc.
        node1:
          ansible_host: <VM1_IP>
          ansible_user: <VM1_USER>
        
        node2:
          ansible_host: <VM2_IP>
          ansible_user: <VM2_USER>
        
        # Add more nodes as needed:
        # node3:
        #   ansible_host: <VM3_IP>
        #   ansible_user: <VM3_USER>
