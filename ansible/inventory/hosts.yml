all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  
  children:
    # ===== Proxmox Host =====
    proxmox_hosts:
      hosts:
        proxmox:
          ansible_host: <PROXMOX_IP>
          ansible_user: <PROXMOX_USER>
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_ssh_common_args: ''  # Direct access, no jump
    
    # ===== VMs =====
    vms:
      vars:
        ansible_ssh_common_args: '-o ProxyJump=<BASTION_USER>@<BASTION_IP>'
      
      children:
        # Bastion host
        bastion:
          hosts:
            bastion:
              ansible_host: <BASTION_IP>
              ansible_user: <BASTION_USER>
              ansible_ssh_common_args: '-o ProxyJump=<PROXMOX_USER>@<PROXMOX_IP>'
        
        # Kubernetes Cluster
        k8s_cluster:
          vars:
            # Common K8s variables
            k8s_version: "1.29.0"
            container_runtime: containerd
          
          children:
            # Control Plane nodes
            k8s_control_plane:
              hosts:
                cp1:
                  ansible_host: <CP1_IP>
                  ansible_user: ubuntu
                cp2:
                  ansible_host: <CP2_IP>
                  ansible_user: ubuntu
                cp3:
                  ansible_host: <CP3_IP>
                  ansible_user: ubuntu
            
            # Worker nodes
            k8s_workers:
              hosts:
                worker1:
                  ansible_host: <WORKER1_IP>
                  ansible_user: ubuntu
                worker2:
                  ansible_host: <WORKER2_IP>
                  ansible_user: ubuntu
